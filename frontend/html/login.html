<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyLibrary</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="navigation">
        <div class="nav-left">
            <a id="navRegister" href="register.html">Register</a>
        </div>

        <div class="nav-right">
            <a id="navHome" href="index.html">Home</a>
            <a id="navFeatured" href="featured.html">Featured Books</a>
        </div>
    </div>

    <div class="container">

        <h1>My Library - Personal Book Management System</h1>

        <div class="card">

            <h2>Login</h2>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage"></p>
            <p>Don't have an account? <a href="./register.html">Register here!</a></p>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/books.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/library.js"></script>
    <script src="../js/featured.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
