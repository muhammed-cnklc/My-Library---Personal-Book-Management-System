<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MyLibrary</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="navigation">
        <div class="nav-left">
            <a id="navLogin" href="login.html">Login</a>
        </div>

        <div class="nav-center">
            <a id="navHome" href="index.html">Home</a>
            <a id="navFeatured" href="featured.html">Featured Books</a>
        </div>
    </div>

    <div class="container">

        <h1>My Library - Personal Book Management System</h1>

        <div class="card">

            <h2>Register</h2>

            <form id="registerForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage"></p>
            <p>Already have an account? <a href="./login.html">Login here!</a></p>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/books.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/library.js"></script>
    <script src="../js/featured.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
